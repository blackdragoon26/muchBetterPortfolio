        - Co-led 10+ tech events & anchored the GDSC WOW flagship event at IIIT Delhi,
          with the 31+ crew members.
        - Engaged a live audience of 800+ at WOW and 500+ developers overall, boosting
          participation by 30% and visibility by 40%.
