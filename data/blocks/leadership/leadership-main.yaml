        - Partnered with marketing to revamp social media presence across LinkedIn, Instagram,
          and X, achieving a 60% bump in engagement.
    - title: Co-Organizer & Anchor, Google Developer Groups & GDSC WOW 2024, Delhi NCR
      dates: Nov 2023 -- Nov 2025
