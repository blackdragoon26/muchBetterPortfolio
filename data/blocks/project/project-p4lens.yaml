    - React Flow
    - P4
content:
  approach:
    - Built a parser for P4-14 and P4-16 programs
    - Rendered headers, parsers, controls, and deparsers as interactive React Flow topologies
  impact: Renders pipeline diagrams in under 200 ms and reduces control-plane debugging effort by approximately 40 percent.
  link: https://p4lens.vercel.app/
