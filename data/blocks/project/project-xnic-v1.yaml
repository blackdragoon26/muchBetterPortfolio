content:
  approach:
    - Implemented PCI probe/remove, BAR0 MMIO, coherent and streaming DMA rings, interrupt-driven NAPI, TX queue backpressure, ethtool counters, and serialized watchdog/reset recovery in C
    - Added staged fault injection, KFENCE and sparse qualification, reproducible QEMU/HVF automation, Wireshark-compatible captures, a W5500 SPI driver path, and an rte_ethdev L2 forwarder
  impact: Qualified 10,100 RX and TX ring wraps across 646,400 packets at zero loss, 1,000 interface cycles, 100 driver rebinds, and 100 reset-under-traffic cycles; validated DPDK partial-TX cleanup and signal-safe shutdown with the net_pcap virtual PMD.
  link: https://xnic-v1.vercel.app/
  objective: Build and qualify a defensible clean-room Linux Ethernet driver with observable packet paths, ownership invariants, fault recovery, and a gated user-space DPDK forwarding path.
  stack: Linux Kernel, C, PCI, BAR0 MMIO, DMA, Descriptor Rings, e1000, Intel 82540EM, net_device, NAPI, IRQ, MSI, ethtool, QEMU, HVF, KFENCE, sparse, DPDK, rte_ethdev, net_pcap PMD, tcpdump, Wireshark, W5500, SPI, Device Tree, Bash, GitHub Actions, Vercel
  title: XNIC v1
variants:
  bullets:
    bullets:
      - 'Built a clean-room Intel 82540EM/e1000-compatible PCI Ethernet driver in C: PCI probe/remove, BAR0 MMIO, coherent and streaming DMA descriptor rings, interrupt-driven NAPI receive processing, TX queue backpressure, ethtool telemetry, and serialized watchdog/reset recovery.'
      - 'Qualified the driver under KFENCE and sparse static analysis with staged fault injection: 10,100 RX/TX ring wraparounds across 646,400 packets at zero loss, 1,000 interface up/down cycles, 100 module rebinds, and 100 reset-under-traffic cycles, all on reproducible QEMU/HVF automation.'
      - Extended the driver with a software-qualified W5500 SPI driver path and a gated DPDK L2 forwarder; validated partial-TX cleanup and signal-safe shutdown against the net_pcap virtual PMD, debugging packet-path failures with tcpdump/Wireshark captures.
    stack: C, Linux Kernel, PCI, DMA, NAPI, QEMU, DPDK (rte_ethdev)
