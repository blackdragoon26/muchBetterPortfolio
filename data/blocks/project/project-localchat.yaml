  description: Single-binary, zero-dependency Go web chat and Android APK for personal devices over Tailscale, built because scanning WhatsApp Web every day got old. Uses ~8.5 MB RAM open (0 MB idle after 5 min auto-shutdown), syncs offline queues across devices, and streams 250 MB uploads with HTTP `Range` media playback.
