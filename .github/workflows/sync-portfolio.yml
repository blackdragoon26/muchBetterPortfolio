# Refreshes portfolio data from GitHub and recaptures live project screenshots,
# then rebuilds the résumés so the two stay consistent.
#
# Capturing screenshots takes around six and a half minutes — 78% of this job —
# so it is not on the push path. Editing a block or a manifest runs
# build-resumes.yml instead, which skips all of this and finishes in about a
# minute. This one runs nightly, when the profile README changes, or on demand.
name: Sync portfolio and resumes

on:
  repository_dispatch:
    types: [profile-readme-updated]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: portfolio-content-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      MIN_REPO_STARS: ${{ vars.PORTFOLIO_MIN_REPO_STARS || '300' }}
      TECTONIC_VERSION: "0.17.0"
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4

      - name: Check out profile README
        uses: actions/checkout@v4
        with:
          repository: blackdragoon26/blackdragoon26
          ref: main
          path: .profile-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - name: Install locked dependencies
        run: npm ci

      - name: Generate projects and featured PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_README_PATH: .profile-source/README.md
        run: node scripts/sync-portfolio.mjs

      - name: Install screenshot browser
        run: npx playwright install --with-deps chromium

      # The slow step — roughly 6.5 minutes — and the reason this workflow is
      # not on the push path.
      - name: Capture live project screenshots
        run: node scripts/capture-project-screenshots.mjs

      # Refreshes machine-owned facts on every block. Authored prose and variants
      # are held in a separate map and are never written by this step.
      - name: Import portfolio data into the block store
        run: go run ./cmd/importer

      # The musl build is statically linked, so it depends on nothing the runner
      # image happens to provide. The gnu build links against the host's
      # harfbuzz and freetype and fails here with "xparse.sty not found", while
      # the same version and document compile cleanly under musl. This also
      # matches the binary the published container uses, so CI and production
      # typeset with one toolchain rather than two.
      - name: Install tectonic
        run: |
          curl -fsSL -o tectonic.tar.gz \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf tectonic.tar.gz
          sudo install -m 0755 tectonic /usr/local/bin/tectonic
          tectonic --version

      # tectonic fetches only the LaTeX packages this document needs, then caches
      # them. Without this the first compile of every run spends minutes on
      # downloads that never change.
      - name: Cache tectonic support files
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ env.TECTONIC_VERSION }}-${{ hashFiles('internal/render/templates/document.tmpl') }}
          restore-keys: |
            tectonic-${{ env.TECTONIC_VERSION }}-

      - name: Build every résumé
        run: go run ./cmd/resumekit build

      # resumekit exits non-zero on a compile failure or a blown page budget, so
      # reaching here means every PDF was produced. Confirm they are on disk and
      # non-trivial anyway: a silently empty PDF committed to the site would be
      # worse than a failed build.
      - name: Check the built PDFs
        run: |
          set -euo pipefail
          missing=0
          for pdf in public/resume/*.pdf; do
            size=$(stat -c%s "$pdf")
            printf '%-46s %8s bytes\n' "$pdf" "$size"
            if [ "$size" -lt 10000 ]; then
              echo "::error::$pdf is only $size bytes"
              missing=1
            fi
          done
          exit "$missing"

      - name: Commit generated content
        run: |
          git config user.name "portfolio-sync[bot]"
          git config user.email "portfolio-sync[bot]@users.noreply.github.com"
          git add src/generated public/generated public/resume data/blocks
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync portfolio content and resumes"
          git push
