# Publishes the résumé builder image to GHCR.
#
# Myprod's onboarding contract requires an immutable, commit-tagged, anonymously
# pullable image and a recorded digest, so the commit SHA is the real tag and
# "latest" is only a convenience pointer.
name: Publish builder image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - .github/workflows/publish-builder-image.yml
  workflow_dispatch:

concurrency:
  group: publish-builder-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 is the Oracle control-plane architecture; amd64 is kept so the
          # image can be run and smoke-tested on an ordinary x86 laptop.
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/blackdragoon26/resume-builder:${{ github.sha }}
            ghcr.io/blackdragoon26/resume-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the digest for the Myprod handoff
        run: |
          {
            echo "### Myprod handoff values"
            echo
            echo '```txt'
            echo "image: ghcr.io/blackdragoon26/resume-builder:${{ github.sha }}"
            echo "image digest: ${{ steps.push.outputs.digest }}"
            echo "source commit: ${{ github.sha }}"
            echo '```'
            echo
            echo "The package must be made public once before an anonymous pull will work."
          } >> "$GITHUB_STEP_SUMMARY"
