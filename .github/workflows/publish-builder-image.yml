# Publishes the résumé builder image to GHCR.
#
# Myprod's onboarding contract requires an immutable, commit-tagged, anonymously
# pullable image and a recorded digest, so the commit SHA is the real tag and
# "latest" is only a convenience pointer.
name: Publish builder image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - .github/workflows/publish-builder-image.yml
  workflow_dispatch:

concurrency:
  group: publish-builder-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # A native ARM runner, free for public repositories. The deployment target
    # is aarch64, so building on x86 meant emulating the one architecture that
    # matters while the unused amd64 image built natively.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          # Build-only job: no git operations, so keep the token out of .git/config.
          persist-credentials: false

      # No QEMU: the runner and the target share an architecture now.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Only the architecture that is actually deployed. Oracle is aarch64
          # and so is the Mac this is developed on, so an amd64 image was built
          # every release and never pulled.
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/blackdragoon26/resume-builder:${{ github.sha }}
            ghcr.io/blackdragoon26/resume-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Hands the freshly built digest to Myprod, which updates the registration
      # and rolls the allocation in one call. The token is scoped to this app
      # alone, and the agent only accepts a digest in the repository the app is
      # already registered against, so a leaked CI credential cannot point the
      # deployment at an arbitrary image.
      - name: Deploy to Myprod
        id: deploy
        if: vars.MYPROD_AGENT_URL != ''
        env:
          AGENT_URL: ${{ vars.MYPROD_AGENT_URL }}
          DEPLOY_TOKEN: ${{ secrets.MYPROD_DEPLOY_TOKEN }}
          IMAGE: ghcr.io/blackdragoon26/resume-builder@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_TOKEN}" ]; then
            echo "MYPROD_DEPLOY_TOKEN is not set; skipping deploy." >&2
            exit 1
          fi

          echo "Deploying ${IMAGE}"
          status=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' \
            -X POST "${AGENT_URL%/}/__poolctl/api/apps/resume-builder/image" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$(printf '{"image":"%s"}' "${IMAGE}")")

          cat /tmp/deploy.json
          if [ "${status}" != "200" ]; then
            echo "::error::Myprod deploy failed with HTTP ${status}"
            exit 1
          fi

      # A 200 from the agent means the job was submitted, not that the container
      # came up. Poll the public endpoint so a crash-looping release fails the
      # workflow instead of being reported as a successful deploy.
      - name: Verify the deployed service is healthy
        if: steps.deploy.outcome == 'success'
        env:
          HEALTH_URL: ${{ vars.MYPROD_HEALTH_URL || 'https://resume.sankalpjha.dev/healthz' }}
        run: |
          set -uo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "${HEALTH_URL}" > /tmp/health.json 2>/dev/null; then
              echo "healthy after ${attempt} attempt(s): $(cat /tmp/health.json)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${HEALTH_URL} did not become healthy within 5 minutes"
          exit 1

      - name: Record the release
        if: always()
        run: |
          {
            echo "### resume-builder"
            echo
            echo '```txt'
            echo "image:  ghcr.io/blackdragoon26/resume-builder@${{ steps.push.outputs.digest }}"
            echo "commit: ${{ github.sha }}"
            echo "deploy: ${{ steps.deploy.outcome || 'skipped' }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
