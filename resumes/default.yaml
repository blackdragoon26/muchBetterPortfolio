# Reproduces the résumé currently published at public/resume/Sankalp-Jha-Resume.pdf.
# It exists as a regression baseline: if the block renderer can rebuild this one,
# the presets that diverge from it can be trusted.
id: default
label: General - Open Source & Software Engineering
output: public/resume/Sankalp-Jha-Resume.pdf
maxPages: 2

